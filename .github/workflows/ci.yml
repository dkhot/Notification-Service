name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore src/NotificationService.slnx

      - name: Build
        run: dotnet build src/NotificationService.slnx --no-restore --configuration Release

      - name: Test
        run: dotnet test src/Notification.Tests/Notification.Tests.csproj --no-build --configuration Release

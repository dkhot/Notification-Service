services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      SA_PASSWORD: "${SA_PASSWORD}"
      ACCEPT_EULA: "Y"
    ports:
      - "1433:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql   

  api:
    build:
      context: .
      dockerfile: src/Notification.Api/Dockerfile
    depends_on:
      - sqlserver
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: "${ASPNETCORE_ENVIRONMENT:-Production}"
      ConnectionStrings__NotificationDatabase: "Server=sqlserver,1433;Database=NotificationService;User Id=sa;Password=${SA_PASSWORD};TrustServerCertificate=True;"

  worker:
    build:
      context: .
      dockerfile: src/Notification.Worker/Dockerfile
    depends_on:
      - sqlserver
    environment:
      DOTNET_ENVIRONMENT: "${ASPNETCORE_ENVIRONMENT:-Production}"
      ConnectionStrings__NotificationDatabase: "Server=sqlserver,1433;Database=NotificationService;User Id=sa;Password=${SA_PASSWORD};TrustServerCertificate=True;"

  callback:
    build:
      context: .
      dockerfile: src/Callback.Dispatcher/Dockerfile
    depends_on:
      - sqlserver
    environment:
      DOTNET_ENVIRONMENT: "${ASPNETCORE_ENVIRONMENT:-Production}"
      ConnectionStrings__NotificationDatabase: "Server=sqlserver,1433;Database=NotificationService;User Id=sa;Password=${SA_PASSWORD};TrustServerCertificate=True;"

volumes:
  sqlserver-data:

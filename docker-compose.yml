version: "3.9"
services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      SA_PASSWORD: "${SA_PASSWORD}"
      ACCEPT_EULA: "Y"
    ports:
      - "1433:1433"
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P \"$${SA_PASSWORD}\" -Q 'SELECT 1'"]
      interval: 10s
      timeout: 10s
      retries: 6

  api:
    build:
      context: .
      dockerfile: src/Notification.Api/Dockerfile
    depends_on:
      sqlserver:
        condition: service_healthy
    ports:
      - "5000:80"
    environment:
      ConnectionStrings__NotificationDatabase: "Server=sqlserver,1433;Database=NotificationService;User Id=sa;Password=${SA_PASSWORD};TrustServerCertificate=True;"

  worker:
    build:
      context: .
      dockerfile: src/Notification.Worker/Dockerfile
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      ConnectionStrings__NotificationDatabase: "Server=sqlserver,1433;Database=NotificationService;User Id=sa;Password=${SA_PASSWORD};TrustServerCertificate=True;"

  callback:
    build:
      context: .
      dockerfile: src/Callback.Dispatcher/Dockerfile
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      ConnectionStrings__NotificationDatabase: "Server=sqlserver,1433;Database=NotificationService;User Id=sa;Password=${SA_PASSWORD};TrustServerCertificate=True;"
